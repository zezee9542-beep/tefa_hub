<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Tefa-Hub — Sedang Offline</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { align-items: center; background: #f8fafc; color: #0f172a; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
        main { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 18px 50px rgba(15, 23, 42, .08); max-width: 420px; padding: 32px; text-align: center; }
        img { height: 42px; margin-bottom: 20px; width: auto; }
        h1 { font-size: 24px; margin: 0 0 12px; }
        p { color: #475569; line-height: 1.6; margin: 0; }
        button { background: #2563eb; border: 0; border-radius: 10px; color: #fff; cursor: pointer; font: inherit; font-weight: 700; margin-top: 24px; padding: 12px 18px; }
    </style>
</head>
<body>
    <main>
        <img src="/assets/logo.webp" alt="Logo Tefa-Hub">
        <h1>Anda sedang offline</h1>
        <p>Periksa koneksi internet, lalu coba lagi. Halaman publik yang pernah dibuka tetap dapat digunakan saat offline.</p>
        <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
</body>
</html>
